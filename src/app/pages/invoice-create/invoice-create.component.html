<div class="invoice-container">
  <h2>Create Invoice</h2>

  <form [formGroup]="invoiceForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Customer Name</mat-label>
      <input matInput formControlName="customerName" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Invoice Date</mat-label>
      <input matInput type="date" formControlName="invoiceDate" />
    </mat-form-field>

    <div formArrayName="items" class="item-list">
      <div *ngFor="let item of items.controls; let i = index" [formGroupName]="i" class="item-row">
        <mat-form-field appearance="outline" class="item-field">
          <mat-label>Product</mat-label>
          <mat-select formControlName="productId">
            <mat-option *ngFor="let p of products" [value]="p.id">{{ p.name }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="item-field">
          <mat-label>Quantity</mat-label>
          <input matInput type="number" formControlName="quantity" />
        </mat-form-field>

        <div class="item-total">
          ₹ {{ getTotalAmount(item) | number : '1.2-2' }}
        </div>

        <button mat-button color="warn" (click)="removeItem(i)" *ngIf="items.length > 1">
          delete
        </button>
      </div>
    </div>

    <button mat-button color="primary" (click)="addItem()">+ Add Product</button>

    <h3 class="total-display">Grand Total: ₹ {{ getGrandTotal() | number : '1.2-2' }}</h3>

    <button mat-raised-button color="primary" (click)="submit()" [disabled]="invoiceForm.invalid">
      Submit Invoice
    </button>

    
  </form>
  <button mat-raised-button color="primary" (click)="exportToPDF()">Export Invoice as PDF</button>

</div>
